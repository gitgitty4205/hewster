<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" fill="none">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#243026" flood-opacity="0.13"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#17251d" flood-opacity="0.16"/>
    </filter>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #415044; }
      .small { font-size: 22px; font-weight: 750; }
      .caption { font-size: 16px; font-weight: 650; fill: #738175; }
      .stroke { stroke: #f8fff8; stroke-linecap: round; stroke-linejoin: round; }
      .darkStroke { stroke: #405642; stroke-linecap: round; stroke-linejoin: round; }
      .pawFill { fill: #f8fff8; }
      .green { fill: #6f8d6b; }
      .deep { fill: #557150; }
      .sage { fill: #8ca884; }
      .cream { fill: #f7f1dc; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#edf4ec"/>
  <text x="60" y="72" class="label" style="font-size:34px;font-weight:820;">Notebook + Paw Brand Icon Options</text>
  <text x="60" y="104" class="caption">Same idea in a few styles, from literal notebook to softer app-icon mark.</text>

  <g transform="translate(60 150)">
    <rect width="320" height="250" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="26" y="42" class="label small">A. Classic notebook</text>
    <text x="26" y="222" class="caption">Simple, recognizable</text>
    <g transform="translate(96 66)" filter="url(#iconShadow)">
      <rect x="18" y="2" width="116" height="142" rx="18" class="green"/>
      <rect x="36" y="22" width="80" height="102" rx="10" fill="#789873"/>
      <path d="M33 22H18M33 47H18M33 72H18M33 97H18M33 122H18" class="stroke" stroke-width="8"/>
      <circle cx="72" cy="74" r="15" class="pawFill"/>
      <circle cx="50" cy="56" r="8" class="pawFill"/>
      <circle cx="66" cy="47" r="8" class="pawFill"/>
      <circle cx="84" cy="47" r="8" class="pawFill"/>
      <circle cx="100" cy="56" r="8" class="pawFill"/>
    </g>
  </g>

  <g transform="translate(440 150)">
    <rect width="320" height="250" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="26" y="42" class="label small">B. Rounded cover</text>
    <text x="26" y="222" class="caption">Soft and app-like</text>
    <g transform="translate(96 66)" filter="url(#iconShadow)">
      <rect x="13" y="0" width="128" height="146" rx="26" class="deep"/>
      <rect x="30" y="16" width="94" height="114" rx="18" class="green"/>
      <path d="M39 36H115M39 104H115" class="stroke" stroke-width="7" opacity=".7"/>
      <circle cx="77" cy="73" r="16" class="pawFill"/>
      <circle cx="55" cy="55" r="8" class="pawFill"/>
      <circle cx="70" cy="45" r="8" class="pawFill"/>
      <circle cx="87" cy="45" r="8" class="pawFill"/>
      <circle cx="101" cy="55" r="8" class="pawFill"/>
    </g>
  </g>

  <g transform="translate(820 150)">
    <rect width="320" height="250" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="26" y="42" class="label small">C. Tabbed notebook</text>
    <text x="26" y="222" class="caption">A little more branded</text>
    <g transform="translate(92 70)" filter="url(#iconShadow)">
      <path d="M38 0H124C135 0 144 9 144 20V128C144 139 135 148 124 148H38C27 148 18 139 18 128V20C18 9 27 0 38 0Z" class="green"/>
      <path d="M18 30H4C2 30 0 32 0 34V62C0 64 2 66 4 66H18V30Z" class="sage"/>
      <path d="M18 77H4C2 77 0 79 0 81V109C0 111 2 113 4 113H18V77Z" class="sage"/>
      <path d="M45 32H116M45 116H116" class="stroke" stroke-width="7" opacity=".7"/>
      <circle cx="82" cy="75" r="16" class="pawFill"/>
      <circle cx="60" cy="57" r="8" class="pawFill"/>
      <circle cx="75" cy="48" r="8" class="pawFill"/>
      <circle cx="92" cy="48" r="8" class="pawFill"/>
      <circle cx="106" cy="57" r="8" class="pawFill"/>
    </g>
  </g>

  <g transform="translate(60 470)">
    <rect width="320" height="250" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="26" y="42" class="label small">D. Outline notebook</text>
    <text x="26" y="222" class="caption">Lightest and cleanest</text>
    <g transform="translate(96 68)" filter="url(#iconShadow)">
      <rect x="18" y="2" width="116" height="142" rx="20" fill="#f2f7ef"/>
      <rect x="18" y="2" width="116" height="142" rx="20" class="darkStroke" stroke-width="8"/>
      <path d="M37 26H20M37 52H20M37 78H20M37 104H20M37 130H20" class="darkStroke" stroke-width="7"/>
      <circle cx="77" cy="78" r="15" class="deep"/>
      <circle cx="55" cy="60" r="8" class="deep"/>
      <circle cx="71" cy="51" r="8" class="deep"/>
      <circle cx="88" cy="51" r="8" class="deep"/>
      <circle cx="102" cy="60" r="8" class="deep"/>
    </g>
  </g>

  <g transform="translate(440 470)">
    <rect width="320" height="250" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="26" y="42" class="label small">E. Paw badge</text>
    <text x="26" y="222" class="caption">More logo-like</text>
    <g transform="translate(92 66)" filter="url(#iconShadow)">
      <rect x="22" y="0" width="116" height="148" rx="22" class="green"/>
      <path d="M42 26H118M42 122H118" class="stroke" stroke-width="7" opacity=".72"/>
      <circle cx="80" cy="75" r="43" fill="#f4f1dc"/>
      <circle cx="80" cy="84" r="15" class="deep"/>
      <circle cx="58" cy="67" r="8" class="deep"/>
      <circle cx="73" cy="58" r="8" class="deep"/>
      <circle cx="90" cy="58" r="8" class="deep"/>
      <circle cx="104" cy="67" r="8" class="deep"/>
    </g>
  </g>

  <g transform="translate(820 470)">
    <rect width="320" height="250" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="26" y="42" class="label small">F. Stacked pages</text>
    <text x="26" y="222" class="caption">Notebook with depth</text>
    <g transform="translate(88 68)" filter="url(#iconShadow)">
      <rect x="28" y="12" width="112" height="132" rx="18" fill="#dfead8"/>
      <rect x="16" y="2" width="112" height="132" rx="18" class="green"/>
      <path d="M35 28H108M35 112H108" class="stroke" stroke-width="7" opacity=".7"/>
      <path d="M16 28H2M16 55H2M16 82H2M16 109H2" class="stroke" stroke-width="7"/>
      <circle cx="73" cy="73" r="16" class="pawFill"/>
      <circle cx="51" cy="55" r="8" class="pawFill"/>
      <circle cx="66" cy="46" r="8" class="pawFill"/>
      <circle cx="83" cy="46" r="8" class="pawFill"/>
      <circle cx="97" cy="55" r="8" class="pawFill"/>
    </g>
  </g>
</svg>
